services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvsystem
      POSTGRES_USER: cvsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvsystem -d cvsystem"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    volumes:
      - data_protection:/root/.aspnet/DataProtection-Keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=cvsystem;Username=cvsystem;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: TalentHub
      Jwt__Audience: TalentHub
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-makej1318@gmail.com}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-Password123!}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      S3__Endpoint: ${S3_ENDPOINT:-}
      S3__AccessKey: ${S3_ACCESS_KEY:-}
      S3__SecretKey: ${S3_SECRET_KEY:-}
      S3__Bucket: ${S3_BUCKET:-}
      S3__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  data_protection:
